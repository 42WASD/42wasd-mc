# Map definition — ATM10SKY skyblock world.
#
# Logical ID per the Phase 0 convention: <map-slug>-<uuid8>
#   atm10sky-03a74e18
# The full UUID lives on the `uuid.42wasd.dev/map` label of the PVC
# (clusters/alpha/atm10sky/atm10sky.yaml).
#
# World data is NOT in Git (see .gitignore: world-data/). The 155 MB save was
# staged into the PVC once, out of band — see the runbook
# 03-step-by-step-implementation/phase-09-deploy-atm10sky.md.
id: atm10sky-03a74e18
uuid: 03a74e18-71ec-4e1e-a4a8-cce319440b39
slug: atm10sky
name: "All the Mods 10: To the Sky"

runtime-id: atm10sky-neoforge-1.21.1
runtime:
  software: neoforge
  loader-version: "21.1.250"
  minecraft: "1.21.1"
  java: "21"

# Runtime is a modded server pack, not a plugin stack. 322 mods.
modpack:
  source: curseforge
  project-id: 1298402 # all-the-mods-10-sky
  server-pack-file-id: 9262010 # ATM10SKY-2.2.0-server.zip
  server-pack-version: "2.2.0"

# Saved-world properties that must match the pack or the world will not load.
level-type: "skyblockbuilder:skyblock"
allow-flight: true
generator-mods:
  # The world is a pre-generated skyblock; SkyBlock Builder must be present or
  # the level-type is unknown and the server generates a void/overworld instead.
  - skyblockbuilder

# Exposure: reached by HOSTNAME through the mc-router edge, not by a public
# port of its own. The Service is ClusterIP; mc-router owns the only NodePort
# (30079) and dispatches on the hostname inside the Minecraft handshake.
#
#   mc-oompas.42base.com:25565 -> mc-router -> atm10sky
#
# Not behind Velocity: this is a modded runtime (NeoForge 1.21.1) and
# velocity.toml uses player-info-forwarding-mode = "none", so proxying would add
# a failure domain across 322 mods and pass no identity benefit. mc-router is a
# different thing — it reads the hostname and proxies raw TCP, needing no
# Velocity or mod compatibility.
#
# Runtime class D (`experimental-*`): the client runtime differs from vanilla,
# so it must be launcher-matched (AstralRinth + Modrinth Server Project) and is
# EXCLUDED from the instant-portal pool per the runtime-class rule.
exposure:
  type: clusterip
  hostname: mc-oompas.42base.com
  via: mc-router
  online-mode: false # cracked/offline clients allowed, same as the lobby
  runtime-class: experimental-atm10sky
  require-launcher: true
  instant-portal-pool: false

kubernetes:
  namespace: prd-games-42wasd-admin
  workload: deployment/atm10sky
  pvc: atm10sky-data
  storage-class: nvme-fast
  storage-request: 40Gi
