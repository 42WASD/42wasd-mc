# Games namespace egress policy.
#
# The platform layer (ArgoCD `platform-networkpolicies`) applies a `default-deny`
# NetworkPolicy (ingress + egress) to this namespace, plus a cluster-wide
# `CiliumClusterwideNetworkPolicy` named `allow-to-kube-apiserver`.
#
# Reaching the kube-apiserver (ClusterIP 10.43.0.1:443) is handled by that
# platform CCNP using the Cilium `kube-apiserver` entity. DNS is granted by the
# platform `allow-cluster-dns` policy. Neither is done here.
#
# IMPORTANT — ipBlock is NOT usable for intra-cluster flows in Cilium:
#   By default, Cilium `ipBlock` / CIDR selectors do NOT match pod or node IPs.
#   So an `ipBlock: 0.0.0.0/0` allow-egress rule silently drops pod-to-pod
#   traffic (Nakama -> CockroachDB), and it never matches the self-hosted
#   apiserver. See the iac reference design
#   `05-gitops-bootstrap/default-deny-networkpolicy`. Always express in-cluster
#   flows with pod/label selectors, not CIDRs.
#
# This policy therefore grants ONLY the actual in-cluster egress flows the
# games workloads need, via label selectors:
#   - Nakama  -> CockroachDB   :26257 (PostgreSQL wire protocol over TLS)
#   - Velocity -> Paper lobby  :25565
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-games-egress
  namespace: prd-games-42wasd-admin
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Nakama -> CockroachDB
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cockroachdb
      ports:
        - protocol: TCP
          port: 26257
    # Velocity -> Paper lobby
    - to:
        - podSelector:
            matchLabels:
              app: paper-lobby
      ports:
        - protocol: TCP
          port: 25565
    # Velocity -> internet (HTTPS): the itzg/mc-proxy image downloads the
    # Velocity jar from fill.papermc.io on first start. This is EXTERNAL
    # traffic, so Cilium ipBlock DOES match it (the ipBlock caveat above only
    # applies to in-cluster pod/node CIDRs). Scope to the velocity pods only.
    - to:
        - podSelector:
            matchLabels:
              app: velocity
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# Scoped ingress for the games namespace.
#
# Unlike the previous ad-hoc `allow-games-ingress` (which was `ingress: [{}]` —
# allow ALL ingress to EVERY pod), this policy only opens the ports each
# workload actually needs:
#   - Velocity  :25565 Minecraft client connections (the public front door;
#     itzg/mc-proxy binds SERVER_PORT=25565 regardless of the velocity.toml).
#   - Velocity  :25577 (config bind port; retained for parity).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-games-ingress
  namespace: prd-games-42wasd-admin
spec:
  podSelector:
    matchLabels:
      app: velocity
  policyTypes:
    - Ingress
  ingress:
    # Allow Minecraft clients (external) to reach the Velocity proxy.
    # External traffic arrives via the cloudflared tunnel / node, represented
    # by the Cilium remote-node + kube-apiserver entities. Because this is a
    # standard NetworkPolicy (not a Cilium one), we allow from all peers so
    # external ingress still works while egress stays default-deny.
    - ports:
        - protocol: TCP
          port: 25565
        - protocol: TCP
          port: 25577
---
# Backend ingress: allow the Velocity proxy to connect to the Paper lobby.
#
# The namespace is default-deny (ingress + egress). The `allow-games-egress`
# policy lets velocity initiate egress to paper-lobby, but the DESTINATION pod
# must ALSO allow ingress — otherwise default-deny drops the connection at the
# lobby. Kubernetes NetworkPolicies are one-way: an egress allow on the source
# alone is NOT sufficient; the backend needs a matching ingress allow from the
# proxy. Velocity must reach paper-lobby :25565 to forward players to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-paper-lobby
  namespace: prd-games-42wasd-admin
spec:
  podSelector:
    matchLabels:
      app: paper-lobby
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: velocity
      ports:
        - protocol: TCP
          port: 25565
---
# Backend ingress: allow Nakama to connect to CockroachDB.
#
# The namespace is default-deny (ingress + egress). `allow-games-egress` lets
# nakama initiate egress to cockroachdb :26257, but the DESTINATION pod must
# ALSO allow ingress — otherwise default-deny drops the connection at the DB.
# Kubernetes NetworkPolicies are one-way: an egress allow on the source alone
# is NOT sufficient; the backend needs a matching ingress allow from the
# client. Nakama must reach cockroachdb :26257 (PostgreSQL wire over TLS) to
# run migrations and serve its backing store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nakama-to-cockroachdb
  namespace: prd-games-42wasd-admin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cockroachdb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nakama
      ports:
        - protocol: TCP
          port: 26257