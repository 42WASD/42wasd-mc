# Nakama — social, identity, and game server. Lives beside Minecraft, not inside it.
# Deployed to the games namespace (prd-games-42wasd-admin on alpha-games-prd).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakama
  namespace: prd-games-42wasd-admin
  labels:
    app: nakama
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nakama
  template:
    metadata:
      labels:
        app: nakama
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: nakama-migrate
          image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # NOTE: Nakama does NOT read NAKAMA_DB_ADDRESS from the environment.
          # The database must be configured via the --database.address CLI flag.
          command: ["/nakama/nakama"]
          args:
            - "migrate"
            - "up"
            - "--database.address"
            - "root@cockroachdb-public:26257/nakama?sslmode=verify-full&sslrootcert=/certs/ca.crt&sslcert=/certs/tls.crt&sslkey=/certs/tls.key"
          volumeMounts:
            - name: crdb-client-certs
              mountPath: /certs
              readOnly: true
      containers:
        - name: nakama
          image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 7349
              name: api
            - containerPort: 7350
              name: console
            - containerPort: 7351
              name: rpc
          command: ["/nakama/nakama"]
          args:
            - "--database.address"
            - "root@cockroachdb-public:26257/nakama?sslmode=verify-full&sslrootcert=/certs/ca.crt&sslcert=/certs/tls.crt&sslkey=/certs/tls.key"
          volumeMounts:
            - name: data
              mountPath: /nakama/data
            - name: crdb-client-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: crdb-client-certs
          secret:
            secretName: cockroachdb-client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: nakama
  namespace: prd-games-42wasd-admin
  labels:
    app: nakama
spec:
  selector:
    app: nakama
  ports:
    - name: api
      port: 7349
      targetPort: 7349
    - name: console
      port: 7350
      targetPort: 7350