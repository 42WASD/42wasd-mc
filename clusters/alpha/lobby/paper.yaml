# Paper lobby — the network's home world / spawn.
# This is the first runtime (runtime-id: lobby-1) behind the Velocity proxy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paper-lobby-data
  namespace: prd-games-42wasd-admin
  labels:
    app: paper-lobby
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nvme-fast
---
apiVersion: v1
kind: Service
metadata:
  name: paper-lobby
  namespace: prd-games-42wasd-admin
  labels:
    app: paper-lobby
spec:
  selector:
    app: paper-lobby
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-lobby
  namespace: prd-games-42wasd-admin
  labels:
    app: paper-lobby
spec:
  replicas: 1
  # RWO PVC on a single node: RollingUpdate can never progress because the new
  # pod can't mount the volume until the old pod (holding it) is deleted, and
  # the old pod isn't deleted until the new one is Ready -> deadlock. Use
  # Recreate so the old pod is removed first, then the new one mounts the freed
  # volume. Correct pattern for single-replica, RWO-backed stateful workloads.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paper-lobby
  template:
    metadata:
      labels:
        app: paper-lobby
    spec:
      # UID/GID 10000 = dedicated, non-human "workload" identity.
      #
      # WHY NOT 1000: container emptyDir volumes live under
      # /var/lib/kubelet/pods/... which is on `/` — and `/` is mounted
      # `ext4 quota,usrquota`. UID 1000 is the host login `jyao`, so every byte
      # a game pod wrote to an emptyDir was charged to a human's 10 GiB home
      # quota. When it filled, the JVM/init got `EDQUOT` ("Disk quota
      # exceeded"), which surfaced as random crash loops that a reboot
      # "fixed" (restarting pods wipes their emptyDir). UID 10000 has no
      # quota configured, so workloads can no longer poison a human quota
      # bucket, and a human filling their home can no longer kill the servers.
      #
      # NOTE: the PVC data on disk is owned by 1000:1000. Ownership was
      # migrated to 10000:10000 before this change (see runbook). CSI
      # fsGroupPolicy is ReadWriteOnceWithFSType, so fsGroup is applied
      # consistently.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paper
          # Java 25 crashes Paper's bundled Spark profiler (async-profiler
          # native lib) with SIGSEGV ~37s after boot (lucko/spark#565). Use the
          # same release tag on Java 21, which Spark supports.
          image: itzg/minecraft-server:2026.8.2-java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "1.21.10"
            # Boot-order race fix: with TYPE=PAPER the image's start-deployPaper
            # ALWAYS calls the PaperMC API (fill.papermc.io) to resolve the build,
            # even though the jar already exists in /data. On host reboot the pod
            # starts before CoreDNS/Cilium are serving, the DNS lookup fails with
            # "No route to host" and the init exits 1 -> CrashLoopBackOff until
            # the network settles (26 restarts accumulated over host reboots).
            # PAPER_CUSTOM_JAR points at the already-persisted jar in /data; the
            # script then does `export SERVER=...` and SKIPS the whole download
            # block -> no network needed at startup, fully idempotent.
            # To upgrade Paper: download the new jar into /data, bump this path.
            - name: PAPER_CUSTOM_JAR
              value: "/data/paper-1.21.10-130.jar"
            - name: ONLINE_MODE
              value: "FALSE"
            # PUID/PGID must match the pod securityContext above, otherwise the
            # itzg image re-chowns /data to the old uid on startup.
            - name: PUID
              value: "10000"
            - name: PGID
              value: "10000"
            # itzg/minecraft-server does NOT read k8s resources.limits.memory.
            # Without this it defaults to 1G heap (-Xms/-Xmx 1G), which starves
            # 55 plugins + the 4.8G world (FAWE "high memory" spam). Match the
            # 4Gi pod limit below.
            - name: MEMORY
              value: "4G"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              # JVM heap is 4G (MEMORY) but heap is only part of process memory:
              # metaspace + thread stacks + native + GC overhead. With 55 plugins
              # + 4.8G world loading, heap 4G + overhead exceeded the old 4Gi
              # limit -> OOMKilled. Give 2x heap for safe headroom. Node has
              # ~72Gi allocatable so this is cheap.
              memory: 8Gi
          securityContext:
            # Compliant with the namespace PodSecurity "restricted" profile.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paper-lobby-data