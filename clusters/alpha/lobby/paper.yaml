# Paper lobby — the network's home world / spawn.
# This is the first runtime (runtime-id: lobby-1) behind the Velocity proxy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paper-lobby-data
  namespace: prd-games-42wasd-admin
  labels:
    app: paper-lobby
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nvme-fast
---
apiVersion: v1
kind: Service
metadata:
  name: paper-lobby
  namespace: prd-games-42wasd-admin
  labels:
    app: paper-lobby
spec:
  selector:
    app: paper-lobby
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-lobby
  namespace: prd-games-42wasd-admin
  labels:
    app: paper-lobby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paper-lobby
  template:
    metadata:
      labels:
        app: paper-lobby
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paper
          # Java 25 crashes Paper's bundled Spark profiler (async-profiler
          # native lib) with SIGSEGV ~37s after boot (lucko/spark#565). Use the
          # same release tag on Java 21, which Spark supports.
          image: itzg/minecraft-server:2026.8.2-java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "1.21"
            - name: ONLINE_MODE
              value: "FALSE"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            # Compliant with the namespace PodSecurity "restricted" profile.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paper-lobby-data