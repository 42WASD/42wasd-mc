# Velocity proxy — front door of the Minecraft network.
# Deployed to the games namespace (prd-games-42wasd-admin on alpha-games-prd).
#
# Phase 6 will complete this (forwarding secret, Java 25 image, config).
apiVersion: v1
kind: Service
metadata:
  name: velocity
  namespace: prd-games-42wasd-admin
  labels:
    app: velocity
spec:
  selector:
    app: velocity
  ports:
    - name: minecraft
      port: 25577
      targetPort: 25577
      protocol: TCP
    - name: query
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  namespace: prd-games-42wasd-admin
  labels:
    app: velocity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velocity
  template:
    metadata:
      labels:
        app: velocity
    spec:
      containers:
        - name: velocity
          image: ghcr.io/papermc/velocity:3.3.0-SNAPSHOT-219
          ports:
            - containerPort: 25577
              name: minecraft
          volumeMounts:
            - name: config
              mountPath: /run/velocity/config
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: velocity-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velocity-config
  namespace: prd-games-42wasd-admin
data:
  velocity.toml: |
    [server]
    bind = "0.0.0.0:25577"
    motd = "&bWelcome to the Minecraft network"
    compression-level = 1
    online-mode = false
    [proxy]
    # TODO: fill forwarded hosts / online-mode per phase build