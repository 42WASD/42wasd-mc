# Velocity proxy — front door of the Minecraft network.
# Deployed to the games namespace (prd-games-42wasd-admin on alpha-games-prd).
#
# Phase 6 will complete this (forwarding secret, Java 25 image, config).
apiVersion: v1
kind: Service
metadata:
  name: velocity
  namespace: prd-games-42wasd-admin
  labels:
    app: velocity
spec:
  selector:
    app: velocity
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  namespace: prd-games-42wasd-admin
  labels:
    app: velocity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velocity
  template:
    metadata:
      labels:
        app: velocity
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: velocity
          # Reference design (deploy-velocity): Java 25 image for Velocity.
          # The former ghcr.io/papermc/velocity:3.3.0-SNAPSHOT-219 tag did not
          # resolve (ImagePullBackOff); itzg/mc-proxy:java25 is the documented
          # Velocity image and is actively published.
          image: itzg/mc-proxy:java25
          env:
            - name: TYPE
              value: VELOCITY
            - name: MEMORY
              value: 1G
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          securityContext:
            # Compliant with the namespace PodSecurity "restricted" profile.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            # itzg/mc-proxy syncs /config into the /server workdir at startup.
            - name: config
              mountPath: /config
            - name: data
              mountPath: /server
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: velocity-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velocity-config
  namespace: prd-games-42wasd-admin
data:
  velocity.toml: |
    [server]
    bind = "0.0.0.0:25565"
    motd = "&bWelcome to the Minecraft network"
    compression-level = 1
    online-mode = false
    [proxy]
    # TODO: fill forwarded hosts / online-mode per phase build