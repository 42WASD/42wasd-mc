# CockroachDB Helm values — Nakama's backing store.
# Deployed via the official cockroachdb/cockroachdb chart (StatefulSet), NOT the
# operator CR. Installed into the games namespace on alpha-games-prd.
# Pinned chart version: 21.0.4 (app v26.2.5).
#
# Homelab sizing: single node. The chart ships an HA default of 3 replicas; we
# scale down to 1 because this is a single-host (alpha) deployment and the
# design keeps storage local.
statefulset:
  replicas: 1
  podManagementPolicy: OrderedReady

# Single-node bootstrap: with replicas=1 the chart's default `cockroach start
# --join=-0,-1,-2` still peers to the 3 hardcoded ordinals and never elects
# itself, so the readiness probe stays 503 and the init job hangs forever.
# `conf.single-node: true` makes the pod run `cockroach start-single-node`,
# which bootstraps the cluster automatically (no init job needed). This is the
# chart's documented approach for a one-time single-node deployment.
conf:
  single-node: true

# RKE2 ships no default StorageClass, so the chart's empty storageClass default
# leaves PVCs Pending. Pin the PVC to the nvme-backed Retain class.
storage:
  persistentVolume:
    enabled: true
    size: 100Gi
    storageClass: nvme-db