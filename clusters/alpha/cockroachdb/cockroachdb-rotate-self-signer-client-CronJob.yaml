apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: cockroachdb
    app.kubernetes.io/name: cockroachdb
  name: cockroachdb-rotate-self-signer-client
  namespace: prd-games-42wasd-admin
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata: {}
    spec:
      backoffLimit: 1
      template:
        metadata: {}
        spec:
          containers:
          - args:
            - rotate
            - --ca-duration=43800h
            - --ca-expiry=648h
            - --client
            - --client-duration=672h
            - --client-expiry=48h
            - --node
            - --node-duration=8760h
            - --node-expiry=168h
            - --node-client-cron=0 0 */26 * *
            - --readiness-wait=30s
            - --pod-update-timeout=2m
            env:
            - name: STATEFULSET_NAME
              value: cockroachdb
            - name: NAMESPACE
              value: prd-games-42wasd-admin
            - name: CLUSTER_DOMAIN
              value: cluster.local
            image: docker.io/cockroachdb/cockroach-self-signer-cert:1.10
            imagePullPolicy: IfNotPresent
            name: cert-rotate-job
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: cockroachdb-rotate-self-signer
          serviceAccountName: cockroachdb-rotate-self-signer
          terminationGracePeriodSeconds: 30
  schedule: 0 0 */26 * *
  successfulJobsHistoryLimit: 3
  suspend: false
