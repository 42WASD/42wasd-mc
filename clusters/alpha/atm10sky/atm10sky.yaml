# ATM10SKY — All the Mods 10: To the Sky (server pack 2.2.0).
#
# 322 mods on NeoForge 21.1.250 / Minecraft 1.21.1. Reached through mc-router by
# HOSTNAME (mc-oompas.42base.com), not by a public port of its own.
#
#   - Velocity's documented modded support covers Forge >1.20.2; NeoForge is a
#     fork with no explicit compatibility guarantee.
#   - Our velocity.toml uses player-info-forwarding-mode = "none", so the proxy
#     passes no identity anyway — routing modded traffic through it buys
#     nothing and adds a failure domain across 322 mods.
#   - mc-router dispatches at the handshake layer (L7) and proxies raw TCP, so
#     it needs no Velocity/mod compatibility at all: it does not speak Minecraft
#     beyond reading the hostname out of the handshake.
#
# So this world is a SIBLING of Velocity behind the edge router, not a child:
#
#   mc-oompas.42base.com:25565  -> mc-router -> atm10sky   (this file)
#   minecraft.42base.com:25565  -> mc-router -> velocity   -> paper-lobby
#
# Citing this as reference class D (`experimental-*`) per the runtime-class
# rule: a required client runtime that differs from vanilla must be
# launcher-matched, and Runtime D worlds are excluded from the instant-portal
# pool. See maps/atm10sky-03a74e18/map.yaml.
#
# OFFLINE / CRACKED CLIENTS: ONLINE_MODE=FALSE writes online-mode=false into
# server.properties, same as paper-lobby. Auth is vanilla-only and entirely
# independent of the mod loader, so cracked clients join as long as they run
# the matching modpack client-side.
#
# BOOT SAFETY (AGENTS.md "no startup remote-fetch"):
# With TYPE=NEOFORGE the itzg image calls `mc-image-helper install-neoforge`
# on EVERY start. On a host reboot that runs before CoreDNS/Cilium are serving
# and fails -> CrashLoopBackOff (identical to the paper-lobby incident, see
# require-pinned-minecraft-server-jar). Two things make it idempotent here:
#   1. NEOFORGE_INSTALLER points at the installer already persisted in /data,
#      so nothing is downloaded.
#   2. ForgeLikeInstaller skips the install entirely when the saved manifest
#      matches (same MC + loader version and same server entry present):
#      "NeoForge version … is already installed".
# So after the one-time bootstrap the container needs NO network to start.
# The egress rule for maven.neoforged.net exists only for that first bootstrap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atm10sky-data
  namespace: prd-games-42wasd-admin
  labels:
    app: atm10sky
    uuid.42wasd.dev/map: 03a74e18-71ec-4e1e-a4a8-cce319440b39
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: nvme-fast
---
# ClusterIP ONLY — reachable exclusively through mc-router.
#
# The reference design forbids exposing backends directly ("Backends remain
# private ClusterIP services"; acceptance test: "lobby cannot be reached
# directly from public Internet"). The former NodePort 30080 bypassed the edge
# router entirely, so any player who learned the relay IP skipped hostname
# routing altogether.
#
# mc-router resolves this by Service DNS name
# (atm10sky.prd-games-42wasd-admin.svc.cluster.local:25565), so changing the
# port here means updating MAPPING in clusters/alpha/mc-router/mc-router.yaml.
apiVersion: v1
kind: Service
metadata:
  name: atm10sky
  namespace: prd-games-42wasd-admin
  labels:
    app: atm10sky
spec:
  type: ClusterIP
  selector:
    app: atm10sky
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atm10sky
  namespace: prd-games-42wasd-admin
  labels:
    app: atm10sky
spec:
  replicas: 1
  # RWO PVC + single node: RollingUpdate deadlocks (new pod can't mount until
  # the old one releases the volume, and the old one isn't removed until the new
  # one is Ready). Recreate removes the old pod first. Same reasoning as
  # paper-lobby.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atm10sky
  template:
    metadata:
      labels:
        app: atm10sky
    spec:
      # UID/GID 10000 — the dedicated workload identity, NOT the human uid
      # 1000. `/` is ext4 with quota,usrquota and emptyDir lives on
      # /var/lib/kubelet, so running as 1000 would charge a modded server's
      # writes (far heavier than the lobby's) to a person's 10 GiB home quota
      # and reproduce the 2026-11-06 EDQUOT crash loop.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atm10sky
          # Java 21, matching the pack's requirement. Same tag as paper-lobby
          # for consistency (Java 25 breaks Spark's async-profiler, and the
          # pack ships Spark).
          image: itzg/minecraft-server:2026.8.2-java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "NEOFORGE"
            - name: VERSION
              value: "1.21.1"
            # Pinned to the version declared by server pack 2.2.0. Do not use
            # "latest": the pack's mods are built against this exact loader.
            - name: NEOFORGE_VERSION
              value: "21.1.250"
            # Pre-staged on the PVC during bootstrap. Makes install-neoforge
            # read a local file instead of downloading from the internet.
            - name: NEOFORGE_INSTALLER
              value: "/data/.bootstrap/neoforge-21.1.250-installer.jar"
            # Offline / cracked clients, same as the lobby.
            - name: ONLINE_MODE
              value: "FALSE"
            # Pack defaults, from its startserver.sh:
            #   allow-flight=true (required by several mods)
            #   max-tick-time=180000 (modded worlds tick slowly)
            #   level-type=skyblockbuilder:skyblock (this IS a skyblock pack)
            # Put the pack's defaults into server.properties.
            - name: ALLOW_FLIGHT
              value: "TRUE"
            - name: MAX_TICK_TIME
              value: "180000"
            - name: LEVEL_TYPE
              value: "skyblockbuilder:skyblock"
            - name: MOTD
              value: "All the Mods 10: To the Sky"
            # RCON is needed by the preStop hook below to issue a graceful
            # `stop`. Without ENABLE_RCON the hook silently no-ops and the
            # kubelet SIGTERMs the JVM mid-save, which can corrupt region
            # files on a 322-mod world.
            - name: ENABLE_RCON
              value: "true"
            # Never exposed outside the pod network: RCON binds inside the
            # container and no Service publishes 25575. The value is
            # deliberately not a secret-grade password because nothing off-pod
            # can reach it; rotate it if that ever changes.
            - name: RCON_PASSWORD
              value: "atm10sky-rcon-internal"
            # PUID/PGID must match the pod securityContext, or the itzg image
            # re-chowns /data to a different uid on startup.
            - name: PUID
              value: "10000"
            - name: PGID
              value: "10000"
            # itzg ignores resources.limits.memory; this is the JVM heap.
            # 8G heap for 322 mods. The 14Gi pod limit below leaves room for
            # metaspace/GC/native — heap is only part of process memory.
            - name: MEMORY
              value: "8G"
            # Do not let the image rewrite server.properties on every start;
            # the pack's values are applied once and then owned by the user.
            #
            # ⚠️ CONSEQUENCE — env vars no longer reach server.properties:
            # With OVERRIDE_SERVER_PROPERTIES=false, ONLINE_MODE / ALLOW_FLIGHT /
            # LEVEL_TYPE / MOTD above are applied ONLY on a fresh /data. After
            # that the file is authoritative and ADDING AN ENV VAR HERE HAS NO
            # EFFECT (including ENFORCE_SECURE_PROFILE, which the image does
            # otherwise support — see /image/property-definitions.json).
            #
            # Currently live: online-mode=false AND enforce-secure-profile=true.
            # That combination REJECTS offline/cracked clients, because a signed
            # profile key can only come from a real Microsoft session.
            #
            # To let offline clients in, flip the property on the PVC (a manifest
            # change alone will silently do nothing). Full procedure, including
            # the one-time manifest update that makes it persist:
            #   docs/implementation/_runbook/03-step-by-step-implementation/
            #   phase-09-deploy-atm10sky.md  -> "Turning off enforce-secure-profile"
            - name: OVERRIDE_SERVER_PROPERTIES
              value: "false"
          resources:
            requests:
              cpu: "1"
              memory: 10Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 14Gi
              ephemeral-storage: 8Gi
          securityContext:
            # PSS "restricted" compliant.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: data
              mountPath: /data
          # Modded first boot generates a 500 MB world and loads 322 mods;
          # it can exceed 10 minutes on this hardware. Give it room before the
          # kubelet kills it.
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 15
            failureThreshold: 60 # 15 min
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            timeoutSeconds: 5
          # Graceful shutdown: a 322-mod world takes a while to flush regions.
          # Ask the server to `stop` via RCON, then let the JVM exit on its own
          # within terminationGracePeriodSeconds. If RCON is not yet up (pod
          # never became ready) this fails fast and the kubelet falls back to
          # SIGTERM, so it is safe either way.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "rcon-cli stop || true"
      terminationGracePeriodSeconds: 300
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atm10sky-data
