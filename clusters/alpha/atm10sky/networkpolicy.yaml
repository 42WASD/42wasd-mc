# NetworkPolicy for the ATM10SKY server — EGRESS ONLY.
#
# Ingress is intentionally NOT defined here. ATM10SKY is a private ClusterIP
# backend reached solely through mc-router, and that rule lives with the rest of
# the public boundary in clusters/alpha/networkpolicy.yaml
# (`allow-mc-router-to-game-backends`). Keeping it there means the set of pods
# the public edge may reach is reviewable in one file rather than scattered
# across every workload — the failure mode being a forgotten `ingress: [{}]`
# that silently re-exposes a backend.
#
# The namespace is default-deny on BOTH ingress and egress, so egress still
# needs this explicit allow or the modded server cannot bootstrap.
#
# NOTE: `allow-games-egress` grants egress to `app: paper-lobby` and
# `app: velocity` only; it does NOT cover atm10sky. That is deliberate — this
# policy keeps the modded server's rules local to this file so its (slightly
# different) egress needs are visible in one place.
---
# Egress: DNS + the one-time NeoForge/modpack bootstrap.
#
# DNS is already granted namespace-wide by the platform `allow-cluster-dns`
# policy, and the apiserver by the `allow-to-kube-apiserver` CCNP, so neither
# is repeated here.
#
# HTTPS/HTTP egress exists ONLY for the first bootstrap:
#   - maven.neoforged.net  : NeoForge installer (pre-staged, but the image may
#                            re-fetch if the local copy is missing)
#   - CurseForge/CDN      : pack + mod downloads, if you ever switch to
#                            AUTO_CURSEFORGE instead of a pre-staged /data
#   - fill.papermc.io     : unused for NeoForge, harmless
# Once /data is bootstrapped, ForgeLikeInstaller skips the install entirely and
# the server needs no external network at all. Cilium ipBlock DOES match
# external CIDRs (the in-cluster caveat in networkpolicy.yaml does not apply).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-atm10sky-egress
  namespace: prd-games-42wasd-admin
spec:
  podSelector:
    matchLabels:
      app: atm10sky
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
