apiVersion: v1
kind: Service
metadata:
  name: paper-lobby
  namespace: platform
  labels:
    app: paper-lobby
spec:
  selector:
    app: paper-lobby
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-lobby
  namespace: platform
  labels:
    app: paper-lobby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paper-lobby
  template:
    metadata:
      labels:
        app: paper-lobby
    spec:
      containers:
        - name: paper
          image: itzg/minecraft-server:java21-multiarch
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "1.21"
            - name: ONLINE_MODE
              value: "FALSE"
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paper-lobby-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paper-lobby-data
  namespace: platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi