# Argo CD app-of-apps registration
# Points at the platform + tenants roots (rendered from the git repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  destination:
    namespace: argocd-apps
    server: https://kubernetes.default.svc
  project: default
  source:
    path: infra/kubernetes/platform
    repoURL: CHANGE_ME_GIT_REPO
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenants
  namespace: argocd
spec:
  destination:
    namespace: argocd-apps
    server: https://kubernetes.default.svc
  project: default
  source:
    path: infra/kubernetes/tenants
    repoURL: CHANGE_ME_GIT_REPO
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true