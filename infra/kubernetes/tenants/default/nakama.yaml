apiVersion: v1
kind: Namespace
metadata:
  name: game-backends
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakama
  namespace: game-backends
  labels:
    app: nakama
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nakama
  template:
    metadata:
      labels:
        app: nakama
    spec:
      containers:
        - name: nakama
          image: registry.heroiclabs.com/heroiclabs/nakama:3.21.0
          ports:
            - containerPort: 7349
              name: api
            - containerPort: 7350
              name: console
            - containerPort: 7351
              name: rpc
          env:
            - name: "NAKAMA_DB_DATABASE"
              value: "nakama"
            - name: "NAKAMA_DB_ADDRESS"
              value: "cockroachdb-public:26257"
          volumeMounts:
            - name: data
              mountPath: /nakama/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nakama
  namespace: game-backends
  labels:
    app: nakama
spec:
  selector:
    app: nakama
  ports:
    - name: api
      port: 7349
      targetPort: 7349
    - name: console
      port: 7350
      targetPort: 7350
    - name: rpc
      port: 7351
      targetPort: 7351