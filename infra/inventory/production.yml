---
# Production inventory for the platform hosts running the Minecraft network.
# Groups reference roles in ansible/site.yml. Populate host membership as
# hosts are built (see host_vars/ for per-host detail).

all:
  children:
    rke2_servers:
      hosts:
        alpha:
    rke2_agents:
      hosts: {}
    build_nodes:
      hosts:
        build01:
    # Convenience group combining all Linux platform nodes.
    linux_platform:
      children:
        rke2_servers:
        rke2_agents:
        build_nodes: