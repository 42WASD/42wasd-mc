---
# Site playbook for the platform hosts.
#
# Wires the roles in phase order to build and operate the hosts that run the
# Minecraft network. Populate role list + group binding as phases progress
# (see docs/reference-design/build/ for the phased build plan).

- name: Base configuration for all hosts
  hosts: all
  gather_facts: true
  roles:
    - base
    - ssh
    - firewall
    - tailscale

- name: Developer / build hosts
  hosts: build_nodes
  gather_facts: true
  roles:
    - users
    - developer_limits
    - build_node

# RKE2 control plane (rke2_servers group)
- name: RKE2 control plane
  hosts: rke2_servers
  gather_facts: true
  roles:
    - nvidia_host
    - rke2_server

# RKE2 worker agents
- name: RKE2 agents
  hosts: rke2_agents
  gather_facts: true
  roles:
    - rke2_agent