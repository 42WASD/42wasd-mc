---
- name: Ensure /etc/rancher/rke2 exists
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Write RKE2 config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0644"

- name: Write kubelet drop-in
  ansible.builtin.template:
    src: kubelet.conf.d/00-platform.conf.j2
    dest: /etc/rancher/rke2/kubelet.conf.d/00-platform.conf
    mode: "0644"
    directory_mode: "0755"

- name: Render RKE2 Cilium config
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: /etc/rancher/rke2/rke2-cilium-config.yaml
    mode: "0644"

- name: Enable and start rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    state: started
    enabled: true