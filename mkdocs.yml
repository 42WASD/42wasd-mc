site_name: 42wasd-mc
site_description: Technical documentation and guides for the 42wasd-mc project.
site_author: jyao
site_url: https://42wasd.github.io/42wasd-mc/

# Repository Integration
repo_name: 42WASD/42wasd-mc
repo_url: https://github.com/42WASD/42wasd-mc
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    # Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

# Navigation
nav:
  - Home: index.md
  - Understand:
      - Overview: 00-understand/index.md
      - The one-sentence idea: 00-understand/01-the-one-sentence-idea.md
      - Why "one tool" is wrong: 00-understand/02-why-one-tool-is-wrong.md
      - Seven layers: 00-understand/03-seven-layers.md
      - Runtime classes: 00-understand/04-runtime-classes.md
      - Proxy decision: 00-understand/05-proxy-decision.md
      - Tool stack: 00-understand/06-tool-stack.md
      - Why not alternatives: 00-understand/07-why-not-alternatives.md
      - Nakama social: 00-understand/08-nakama-social.md
      - World lifecycle: 00-understand/09-world-lifecycle.md
      - User experiences: 00-understand/10-user-experiences.md
      - Glossary: 00-understand/11-glossary.md
  - Implement:
      - Roadmap: 01-implement/index.md
      - Step 1 — Velocity + lobby: 01-implement/step-01-velocity-lobby.md
      - Step 2 — Forwarding + isolation: 01-implement/step-02-forwarding-isolation.md
      - Step 3 — TAB: 01-implement/step-03-tab.md
      - Step 4 — Protocol: 01-implement/step-04-protocol.md
      - Step 5 — Nakama identity: 01-implement/step-05-nakama-identity.md
      - Step 6 — Friends + parties: 01-implement/step-06-friends-parties.md
      - Step 7 — Second backend + /join: 01-implement/step-07-join.md
      - Step 8 — World Controller: 01-implement/step-08-world-controller.md
      - Step 9 — Scale-to-zero: 01-implement/step-09-scale-to-zero.md
      - Step 10 — Portal wake → transfer: 01-implement/step-10-portal-wake-transfer.md
      - Step 11 — Exact presence + TAB: 01-implement/step-11-tab-exact.md
      - Step 12 — Random map: 01-implement/step-12-random-map.md
      - Step 13 — Fantasy Forge: 01-implement/step-13-fantasy-forge.md
      - Step 14 — Modrinth: 01-implement/step-14-modrinth.md
      - Step 15 — Cross-runtime invite: 01-implement/step-15-cross-runtime-invite.md
      - Step 16 — mc-router edge: 01-implement/step-16-mc-router.md
      - Step 17 — Map upload: 01-implement/step-17-map-upload.md
      - Step 18 — Agones (optional): 01-implement/step-18-agones.md
      - Step 19 — AI proximity: 01-implement/step-19-ai-proximity.md
  - Reference:
      - Overview: 02-reference/index.md
      - RuntimeDefinition schema: 02-reference/runtime-definition.md
      - MapInstance schema: 02-reference/map-instance.md
      - Routing & wake state machine: 02-reference/routing-state-machine.md
      - Random map scoring: 02-reference/random-scoring.md
      - Invite policy: 02-reference/invite-policy.md
      - World readiness contract: 02-reference/world-readiness.md
      - Network security checklist: 02-reference/security-checklist.md
      - Acceptance test: 02-reference/acceptance-test.md
      - Performance principles: 02-reference/performance-principles.md
      - Upgrade policy: 02-reference/upgrade-policy.md
  - Operations:
      - Overview: 03-operations/index.md
      - Backups: 03-operations/backups.md
      - Monitoring: 03-operations/monitoring.md
      - Security: 03-operations/security.md
  - Resources:
      - Overview: 04-resources/index.md
      - Verified references: 04-resources/verified-references.md
      - Final architecture: 04-resources/final-architecture.md

# Markdown Extensions & Syntax Plugins
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

# Extras
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/42WASD/42wasd-mc

