site_name: 42wasd-mc
site_description: Technical documentation and guides for the 42wasd-mc Minecraft network.
site_author: jyao
site_url: https://42wasd.github.io/42wasd-mc/

# Do not publish the runbook source files as standalone pages; they are
# embedded into the Implementation page by the generator.
exclude_docs: |
  implementation/_runbook/

# Repository Integration
repo_name: 42WASD/42wasd-mc
repo_url: https://github.com/42WASD/42wasd-mc
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    # Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

