# Reference design reading order — SINGLE SOURCE OF TRUTH (SSOT)
#
# This manifest is the ONLY place the reading order of the reference design is
# defined. Both docs generators (docs-generate-nav.py and
# docs-generate-implementation.py) read this file and DERIVE every number from
# position in this tree:
#
#   - Part numeral (I, II, III ...)  <- index of the part in `parts`
#   - Phase number                   <- global position of a tracked section
#   - tracked (build) vs untracked   <- the `tracked:` flag below
#
# Because numbers are DERIVED from list order and never stored in page files,
# two phases can never collide. To insert, remove, or reorder a phase, edit
# THIS file only, then re-run both generators.
#
# Rules:
#   - `parts` is an ordered list. Each entry is a dict: { slug: {tracked, sections} }.
#   - `slug` = the folder name under docs/reference-design/.
#   - `sections` = ordered list of direct child folders (slugs) under that part.
#   - Each section may have an optional `subsections` list for deeper nesting.
#   - A part is tracked (appears on the Implementation progress page) iff
#     `tracked: true`. Part 03 is the actionable build phase; the rest are
#     concepts/reference chapters.
#   - Slugs must match the actual folder names on disk.

