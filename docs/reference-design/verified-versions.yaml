# Verified component versions — SINGLE SOURCE OF TRUTH
#
# This file centralizes every pinned/verified version for the reference design.
# Pages should say "see verified-versions.yaml" instead of hard-coding a version
# in ten places. Re-audit before major upgrades; bump `audit_date` each pass.
#
# The generators do NOT read this file; it is documentation, kept in sync
# manually. CI does not fail on a stale value — keep it accurate by hand.
#
# Design principle:
#   documentation  ->  refers to this file
#   this file      ->  exact tested release / tag combo
#   production manifest ->  exact image digest

